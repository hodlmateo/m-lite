[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "m-lite"
version = "0.1.0"
description = "A small public demo of a local-first personal agent stack."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ask-m = "mlite.cli:console_main"

[tool.setuptools]
packages = ["mlite", "mlite.memory", "mlite.registry", "mlite.desk", "mlite.gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
